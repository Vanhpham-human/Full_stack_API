openapi: 3.0.3
info:
  title: AnNam Shop API
  version: 1.0.0
  description: |
    Hợp đồng API-first cho cửa hàng AnNam.
    Đường dẫn chỉ dùng danh từ số nhiều, không có động từ.
    POST tạo mới trả 201. DELETE trả 204.
    Sai định dạng: 400 ERR_VALIDATION.
    Vi phạm nghiệp vụ (trùng email, hết hàng, sai trạng thái): 422.
    Không tìm thấy: 404. Lỗi hệ thống: 500.
    Body lỗi luôn có dạng {"code","message","details":[{"field","issue"}]}.
servers:
  - url: http://localhost:8080
    description: Backend Spring Boot
  - url: http://127.0.0.1:4010
    description: Prism mock server
tags:
  - name: Customers
    description: Đăng ký và hồ sơ khách hàng
  - name: Sessions
    description: Phiên đăng nhập
  - name: Categories
    description: Danh mục hàng hóa
  - name: Products
    description: Sản phẩm, tìm kiếm, tồn kho
  - name: Carts
    description: Giỏ hàng của khách đang đăng nhập
  - name: Orders
    description: Đặt hàng và trạng thái đơn
security:
  - bearerAuth: []
paths:
  /api/v1/customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Đăng ký khách hàng
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/customers/me:
    get:
      tags: [Customers]
      operationId: getCurrentCustomer
      summary: Xem hồ sơ của tôi
      responses:
        '200':
          description: Hồ sơ hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Customers]
      operationId: updateCurrentCustomer
      summary: Cập nhật hồ sơ của tôi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Hồ sơ sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/customers/me/orders:
    get:
      tags: [Customers]
      operationId: listCustomerOrders
      summary: Lịch sử đơn hàng của tôi
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
            example:
              email: demo@annam.vn
              password: Customer@123
      responses:
        '201':
          description: Phiên đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: mock-token
                tokenType: Bearer
                expiresIn: 43200
                customer:
                  id: 2
                  fullName: Khách demo
                  email: demo@annam.vn
                  phone: "0900000002"
                  address: 12 Hàng Bông, Hoàn Kiếm, Hà Nội
                  role: CUSTOMER
                  createdAt: "2026-10-23T02:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/current:
    delete:
      tags: [Sessions]
      operationId: deleteCurrentSession
      summary: Kết thúc phiên hiện tại
      responses:
        '204':
          description: Đã đăng xuất
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: Danh sách danh mục
      security: []
      responses:
        '200':
          description: Các danh mục
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 1
                  name: Nhà bếp
                  description: Đồ nấu và dụng cụ bếp
                - id: 2
                  name: Phòng khách
                  description: Đồ trang trí phòng khách
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Tạo danh mục
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Đã tạo danh mục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Chi tiết danh mục
      security: []
      responses:
        '200':
          description: Danh mục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Cập nhật danh mục
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Danh mục sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Xóa danh mục
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Tìm kiếm sản phẩm có phân trang và lọc giá
      security: []
      parameters:
        - name: q
          in: query
          description: Từ khóa trên tên hoặc mô tả
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: minPrice
          in: query
          description: Giá tối thiểu, đơn vị VND
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxPrice
          in: query
          description: Giá tối đa, đơn vị VND
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: newest, priceAsc, priceDesc hoặc name
          schema:
            type: string
            default: newest
      responses:
        '200':
          description: Trang sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                content:
                  - id: 1
                    name: Ấm đun inox 1.7L
                    description: Ấm đun nước đáy từ, dung tích 1.7 lít.
                    price: 790000
                    imageUrl: https://picsum.photos/seed/annam-1/800/640
                    stockQuantity: 12
                    categoryId: 1
                    categoryName: Nhà bếp
                    createdAt: "2026-10-23T02:00:00Z"
                page: 0
                size: 12
                totalElements: 1
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      operationId: createProduct
      summary: Tạo sản phẩm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Đã tạo sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      operationId: getProduct
      summary: Chi tiết sản phẩm
      security: []
      responses:
        '200':
          description: Sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 1
                name: Ấm đun inox 1.7L
                description: Ấm đun nước đáy từ, dung tích 1.7 lít.
                price: 790000
                imageUrl: https://picsum.photos/seed/annam-1/800/640
                stockQuantity: 12
                categoryId: 1
                categoryName: Nhà bếp
                createdAt: "2026-10-23T02:00:00Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Cập nhật sản phẩm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Sản phẩm sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Products]
      operationId: updateProductStock
      summary: Cập nhật số lượng tồn kho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductStockUpdate'
      responses:
        '200':
          description: Sản phẩm sau khi đổi tồn kho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Xóa sản phẩm
      responses:
        '204':
          description: Đã xóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/carts/me:
    get:
      tags: [Carts]
      operationId: getMyCart
      summary: Xem giỏ hàng của tôi
      responses:
        '200':
          description: Giỏ hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              example:
                id: 1
                customerId: 2
                totalAmount: 790000
                items:
                  - id: 1
                    productId: 1
                    productName: Ấm đun inox 1.7L
                    imageUrl: https://picsum.photos/seed/annam-1/800/640
                    unitPrice: 790000
                    quantity: 1
                    lineTotal: 790000
                    stockQuantity: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/carts/me/items:
    post:
      tags: [Carts]
      operationId: addCartItem
      summary: Thêm sản phẩm vào giỏ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '201':
          description: Giỏ hàng sau khi thêm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/carts/me/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    put:
      tags: [Carts]
      operationId: updateCartItem
      summary: Đổi số lượng một dòng trong giỏ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdate'
      responses:
        '200':
          description: Giỏ hàng sau khi sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Carts]
      operationId: removeCartItem
      summary: Xóa một dòng khỏi giỏ
      responses:
        '204':
          description: Đã xóa khỏi giỏ
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Đặt hàng từ giỏ của tôi
      description: |
        Trong một giao dịch: kiểm tra tồn kho, tính tổng tiền, tạo đơn PENDING, trừ tồn kho.
        Giá lấy tại thời điểm đặt, không nhận giá từ client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Đơn hàng đã tạo ở trạng thái PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 10
                code: ORD-20261023-A1B2C3D4
                status: PENDING
                totalAmount: 790000
                shippingAddress: 12 Hàng Bông, Hoàn Kiếm, Hà Nội
                note: Giao giờ hành chính
                customerId: 2
                customerName: Khách demo
                createdAt: "2026-10-23T04:00:00Z"
                updatedAt: "2026-10-23T04:00:00Z"
                items:
                  - id: 1
                    productId: 1
                    productName: Ấm đun inox 1.7L
                    unitPrice: 790000
                    quantity: 1
                    lineTotal: 790000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Giỏ trống hoặc hết hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: ERR_STOCK_EMPTY
                message: Sản phẩm đã hết hàng
                details:
                  - field: productId
                    issue: Ấm đun inox 1.7L chỉ còn 0 trong kho
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Danh sách toàn bộ đơn hàng
      description: Chỉ quản trị viên. Khách hàng dùng /api/v1/customers/me/orders.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Chi tiết một đơn hàng
      responses:
        '200':
          description: Đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Orders]
      operationId: updateOrderStatus
      summary: Đổi trạng thái đơn hàng
      description: |
        PENDING sang PAID hoặc CANCELLED.
        PAID sang SHIPPED hoặc CANCELLED.
        SHIPPED và CANCELLED là trạng thái kết thúc.
        Hủy đơn hoàn lại tồn kho. Khách chỉ được hủy đơn của mình.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Đơn hàng sau khi đổi trạng thái
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 60
        default: 12
  responses:
    BadRequest:
      description: Dữ liệu sai định dạng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ERR_VALIDATION
            message: Dữ liệu không hợp lệ
            details:
              - field: email
                issue: Email không hợp lệ
    Unauthorized:
      description: Chưa đăng nhập hoặc sai mật khẩu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ERR_UNAUTHORIZED
            message: Bạn cần đăng nhập
            details: []
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ERR_FORBIDDEN
            message: Bạn không có quyền thực hiện thao tác này
            details: []
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ERR_NOT_FOUND
            message: Không tìm thấy dữ liệu
            details: []
    Unprocessable:
      description: Vi phạm quy tắc nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ERR_STOCK_EMPTY
            message: Sản phẩm đã hết hàng
            details:
              - field: productId
                issue: Sản phẩm đã hết hàng
    InternalError:
      description: Lỗi hệ thống
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ERR_INTERNAL
            message: Lỗi hệ thống
            details: []
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: ERR_STOCK_EMPTY
        message:
          type: string
          example: Sản phẩm đã hết hàng
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string
    Role:
      type: string
      enum: [CUSTOMER, ADMIN]
    OrderStatus:
      type: string
      enum: [PENDING, PAID, SHIPPED, CANCELLED]
    Customer:
      type: object
      required: [id, fullName, email, phone, role, createdAt]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    CustomerCreateRequest:
      type: object
      required: [fullName, email, phone, password]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 255
        phone:
          type: string
          pattern: '^(0|\+84)(3|5|7|8|9)[0-9]{8}$'
          x-pattern-message: Số điện thoại không hợp lệ
        password:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).{8,72}$'
          x-pattern-message: Mật khẩu tối thiểu 8 ký tự, gồm chữ và số
        address:
          type: string
          maxLength: 500
    CustomerUpdateRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          pattern: '^(0|\+84)(3|5|7|8|9)[0-9]{8}$'
          x-pattern-message: Số điện thoại không hợp lệ
        address:
          type: string
          maxLength: 500
    SessionCreateRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
    Session:
      type: object
      required: [accessToken, tokenType, expiresIn, customer]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
        customer:
          $ref: '#/components/schemas/Customer'
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
    Product:
      type: object
      required: [id, name, price, stockQuantity, categoryId, categoryName]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
        imageUrl:
          type: string
        stockQuantity:
          type: integer
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        createdAt:
          type: string
          format: date-time
    ProductRequest:
      type: object
      required: [name, description, price, stockQuantity, categoryId]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          minLength: 2
          maxLength: 4000
        price:
          type: integer
          format: int64
          minimum: 1
        imageUrl:
          type: string
          maxLength: 500
        stockQuantity:
          type: integer
          minimum: 0
        categoryId:
          type: integer
          format: int64
          minimum: 1
    ProductStockUpdate:
      type: object
      required: [stockQuantity]
      properties:
        stockQuantity:
          type: integer
          minimum: 0
    ProductPage:
      type: object
