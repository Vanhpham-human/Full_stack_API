spring:
  datasource:
    url: jdbc:h2:mem:annamtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: annam-test-secret-key-must-be-at-least-32b
    expiration-minutes: 60
